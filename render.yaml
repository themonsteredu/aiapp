# Render.com 블루프린트 — DB가 외부(Supabase)에 있으므로 무료 플랜으로도 데이터가 보존됩니다.
# (무료 플랜은 15분 미사용 시 잠들었다 깨어나는 지연만 감수하면 됩니다)
services:
  - type: web
    name: career-edu-webapp
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node --no-warnings server.js
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false # Supabase 연결 문자열(Transaction pooler URI) 입력
      - key: TRUST_PROXY
        value: '1'
      - key: COOKIE_SECURE
        value: '1'
      - key: SUPERADMIN_PASSWORD
        sync: false # 초기 슈퍼관리자 비밀번호
