# Fly.io 설정 — 도쿄(nrt) 리전 기준. `fly launch` 시 자동 인식됩니다.
app = "career-edu-webapp"
primary_region = "nrt"

[build]
  # Dockerfile 사용

[env]
  DATA_DIR = "/data"
  TRUST_PROXY = "1"
  COOKIE_SECURE = "1"

[[mounts]]
  source = "appdata"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
