# Fly.io 설정 — DB는 외부(Supabase) 사용, 볼륨 불필요.
# 배포 전: fly secrets set DATABASE_URL='...' SUPERADMIN_PASSWORD='...'
app = "career-edu-webapp"
primary_region = "nrt"

[build]
  # Dockerfile 사용

[env]
  TRUST_PROXY = "1"
  COOKIE_SECURE = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
