<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>광장 미리보기 — 모아랩</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/plaza.css">
  <style>
    body { height: auto; min-height: 100vh; background: #f6f8f3; }
    main.plaza { max-width: 960px; padding: clamp(24px, 6vw, 72px) 24px; }
    .preview-scene { display: block; width: 100%; margin: 28px 0; border-radius: 14px; }
    .preview-note { max-width: 620px; margin: 18px 0 28px; color: var(--text-2); }
    .preview-state { display: inline-block; padding: 5px 12px; border: 1px solid #bdcec6; border-radius: 20px; color: var(--brand-600); font-size: 13px; }
  </style>
</head>
<body>
  <main class="plaza">
    <p class="plaza-kicker">모아킷 · 모아랩</p>
    <h1>광장 미리보기</h1>
    <span class="preview-state">온라인 연결 준비 중</span>
    <img class="preview-scene" src="/brand/plaza/plaza-background.webp" alt="가게가 들어설 자리가 있는 광장 배경">
    <h2>광장 코드를 먼저 배포했습니다</h2>
    <p class="preview-note">현재는 배포 확인용 페이지입니다. 로그인, 수업 진행, 작품과 진로기록 저장은 온라인 DB 연결 후 사용할 수 있습니다.</p>
    <a class="btn btn-primary" href="/">모아랩 홈으로</a>
  </main>
</body>
</html>
